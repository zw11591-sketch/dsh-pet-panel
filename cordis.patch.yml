# dsh-pet-panel bundle patch: inserts its plugin row into the web plugin
# roster. Installing this package into a dsh profile
# (`dsh plugin --profile web add github:zw11591-sketch/dsh-pet-panel`) applies
# this layer automatically. The row mounts both halves: the modules node half
# scans dsh.client packages into the web plugin roster (served from this
# package's lib/client.js), and the host half (src/index.ts) registers the
# skill / MCP / A2A gateways and the A2A inbound endpoint.
- insert:
    - id: pet-panel
      name: 'dsh-pet-panel'
