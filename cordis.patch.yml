# dsh-pet-panel bundle patch: inserts its plugin row into the web plugin
# roster. Installing this package into a dsh profile
# (`dsh plugin --profile web add github:zw11591-sketch/dsh-pet-panel`) applies
# this layer automatically. The single row mounts the browser half (the
# modules node half scans dsh.client packages into the web plugin roster,
# served from this package's lib/client.js). There is no host-side service:
# the pet and the dashboard both render in the browser only.
- insert:
    - id: pet-panel
      name: 'dsh-pet-panel'
